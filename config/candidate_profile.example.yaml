profile_version: 1
resume_path: config/resume.example.md
target_domains:
  - ADAS
  - autonomous driving
  - active safety
  - vehicle systems
  - validation
  - verification
  - systems engineering
  - simulation
  - sensor fusion
  - robotics
  - mechatronics
target_title_terms:
  - principal
