profile_version: 1
resume_path: config/resume.example.md
target_domains:
  - ADAS
  - autonomous driving
  - active safety
  - vehicle systems
  - validation
  - verification
  - systems engineering
  - simulation
  - sensor fusion
  - robotics
  - mechatronics
target_title_terms:
  - principal
  - staff
  - lead
  - senior
  - systems
  - development
  - validation
  - test
  - robotics
  - mechatronics
  - product technical leader
  - product technical manager
  - product manager
  - vehicle testing
exclude_title_terms: [intern, co-op]
exclude_terms: []
# soft_exclude_terms: like exclude_terms, but a match here is overridden whenever the title/
# department also contains one of strong_relevance_terms — e.g. a future "ADAS Platform
# Architecture Engineer" survives a "platform architecture" soft-exclude because "ADAS" is
# unambiguous evidence of real relevance. Populate via scripts/suggest_exclusions.py's
# suggestions (reviewed and approved manually — never auto-applied); see
# docs/feedback-exclusion-plan.md for the full mechanism. Both empty by default.
soft_exclude_terms: []
strong_relevance_terms: []
minimum_recommendation_score: 75
location:
  country: US
  allowed_work_arrangements: [onsite, hybrid, remote]


# Applicant contact details for the resume-generator / outreach-writer skills. This file is
# git-ignored; fill in your own values. `name` and `email` are required; phone/linkedin/github are
# optional and omitted from the resume header when left out.
contact:
  name: "Your Name"
  email: "you@example.com"
  phone: "+1 555 555 0100"
  linkedin: "https://www.linkedin.com/in/your-handle"
  github: "https://github.com/your-handle"
