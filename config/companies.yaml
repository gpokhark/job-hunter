      # summary (confirmed against requisition 18652: missing Qualifications/benefits/
      # contact sections present on the real detail page), so full descriptions come
      # from the requisition's own public detail page instead, via its schema.org
      # JobPosting JSON-LD block (same extract_job_posting_ld helper html_paginated.py
      # uses for an unrelated platform) — one quirk confirmed live: Hella's JSON-LD uses
      # PascalCase keys (DatePosted/Title/Description) rather than schema.org's usual
      # camelCase, handled in csod.py by checking both. 488 jobs total at time of
      # writing (33 in the US), confirmed via non-overlapping pages at pageSize=250 and
      # requisition 18652 (the given sample job) present in the US-filtered results,
      # titled "Project Manager - Sensors" in Northville, MI — matches the sample job
      # URL exactly. countryCodes is deliberately left unfiltered server-side (even
