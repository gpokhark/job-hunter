  - key: faurecia
    company: Forvia Faurecia
    adapter: eightfold
    platform: eightfold
    config:
      # jobs.faurecia.com/careers ("Careers at Forvia") embeds a full Eightfold PCS
      # position payload directly in its initial HTML (<code id="smartApplyData">,
      # HTML-entity-double-encoded the same way apple.py's hydration blob is) — but the
      # same data is also served plainly, no cookies/session, at /api/apply/v2/jobs
      # (list) and /api/apply/v2/jobs/{id} (detail), found by rendering the job detail
      # page once with Playwright and reading its real XHR calls — not guessed: an
      # initial guess at Deere's /api/pcsx/search path returned a same-shaped 403 "PCSX
      # is not enabled for this user" here. This tenant runs a different, older Eightfold
      # API generation than Deere's — same platform, different surface (flat
      # positions/count, no "data" wrapper; snake_case job_description/canonicalPositionUrl/
      # t_create instead of jobDescription/positionUrl/postedTs) — handled by
      # EightfoldAdapter's shape auto-detection, not by a second adapter class.
      # robots.txt explicitly allows /api/apply. location=united states +
      # filter_include_remote=1 (same params as Deere) cuts the catalog from 377 (global)
      # to 111 (US, confirmed live). Pagination is real (`start` advances through
      # distinct jobs, confirmed at start=0/50/100/110/120, ending cleanly with a
      # 1-item final page then an empty page) but page size is fixed at 10 server-side,
      # same as Deere. Listings are sorted newest-created-first here (t_create confirmed
      # monotonically decreasing across every sampled page, unlike Deere's non-monotonic
      # distance sort) — deliberately uses `t_create`, NOT `t_update`: t_update reflects
      # later edits and is NOT monotonic (jobs on old pages still show recent t_update),
      # while t_create matched the sample job's own JSON-LD `datePosted` almost exactly,
      # confirmed on job ats_job_id 67106 ("Process Engineer Level 1", Fraser, MI).
      #
      # A second URL the user separately supplied for job 67106
      # (career2.successfactors.eu/careers?company=adpllcP3&...) looked suspicious —
      # "adpllcP3" reads like an unrelated ADP tenant slug — but is confirmed genuinely
      # Faurecia's own: it is the exact `apply_redirect_url` this same Eightfold detail
      # API returns for job 67106, and the page itself is titled "Career Opportunities:
      # Process Engineer Level 1 (67106)" with FORVIA/Faurecia branding throughout, no
      # ADP branding anywhere. SuccessFactors Recruiting is Faurecia's real ATS-of-record
      # for the *apply* flow only; "adpllcP3" is just that SF tenant's internal company
      # code, not a different employer. Not used here — Eightfold's own API already
      # carries full listing and detail data.
      list_url: https://jobs.faurecia.com/api/apply/v2/jobs
      detail_url: https://jobs.faurecia.com/api/apply/v2/jobs
      detail_id_in_path: true
      public_base_url: https://jobs.faurecia.com/careers/job
      posted_field: t_create
      params:
        domain: faurecia.com
        location: united states
        filter_include_remote: 1
      detail_params:
        domain: faurecia.com
  - key: rivian
    company: Rivian
    adapter: icims_attract
    platform: icims_attract
    config:
      # careers.rivian.com ("Software Powered by iCIMS") is an Angular SPA over
      # iCIMS's "Attract"/Jibe widget — the search page itself renders nothing
      # server-side, but it calls its own same-origin, unauthenticated JSON endpoint
      # (confirmed via a headless render's XHR log, then verified anonymous with plain
      # curl/httpx): /api/jobs. Each item's inline "data" object already has the full
      # plain-text description/qualifications/responsibilities and structured
      # city/state/country/country_code — no per-job detail fetch needed, same shape
      # as this repo's Ashby entry. limit is capped server-side at 100 (101+ returns
      # HTTP 422); totalCount is 738, and sorted newest-first
      # (sortBy=posted_date&descending=true, confirmed no gaps/dupes across all 8
      # pages) the newest 100 jobs only span ~4 days — so paginate:true always walks
      # the full catalog rather than stopping early, to reliably cover the 30-day
      # recency window. detail_base_url builds the real candidate-facing page
      # (careers.rivian.com/careers-home/jobs/{id}, confirmed via curl to render the
      # correct job with no query params needed) from the listing's bare numeric
      # "slug" — the listing response has no ready-made URL field of its own. Sample
      # job 31447 ("Manager - Autonomy Systems Validation", Wittmann, AZ) confirmed
      # present with matching title/location/date.
      paginate: true
      list_url: https://careers.rivian.com/api/jobs
      params:
        sortBy: posted_date
        descending: true
        internal: false
      limit: 100
      items_path: jobs
