    unsupported_reason: mathworks.com's Akamai bot-management deterministically blocks every request carrying this project's own identifying User-Agent (confirmed 403, 100% reproducible); the identical request succeeds with a bare default UA, but this project does not alter its self-identification to get past a site's own anti-automation control.
