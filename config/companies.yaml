version: 1
# ATS URLs change frequently. Entries without a verified list_url fail explicitly rather
# than inventing an endpoint. Populate source-specific config after running endpoint_probe.py.
# adapter: stealth_html uses a real headless stealth browser (see adapters/stealth_html.py)
# to get past a Cloudflare/Akamai-style bot-management challenge — a deliberate choice for
# this project, made with the understanding that it can conflict with a site's Terms of
# Service. Prefer every other adapter first; only reach for it when no plain anonymous
# endpoint exists at all. Requires `uv sync --extra stealth && uv run scrapling install`.
companies:
  - key: honda
    company: American Honda Motor Co.
    adapter: phenom
    platform: phenom
    config:
      # Full pagination (from/s params) — see PhenomAdapter's docstring for how these
      # were found (rendering the page once to read its own generated links).
      list_url: https://careers.honda.com/us/en/search-results
      keywords: ""
  - key: toyota
    company: Toyota Motor North America
    adapter: workday
    platform: workday
    config:
      # public_base_url is Workday's native candidate-facing host, not the CXS API host
      # used by list_url — same fix/reasoning as GM's entry below.
      workday_native: true
      list_url: https://toyota.wd503.myworkdayjobs.com/wday/cxs/toyota/TMNA/jobs
      public_base_url: https://toyota.wd503.myworkdayjobs.com/en-US/TMNA/
  - key: gm
    company: General Motors
    adapter: workday
    platform: workday
    config:
      # search-careers.gm.com (Findly-branded) is Cloudflare-protected, but it's only a
      # front end — GM's actual candidate-facing system, found via a real job link
      # (generalmotors.wd5.myworkdayjobs.com), is a completely public, unauthenticated
      # Workday CXS API with no bot protection at all. Same total job count (~820) as the
      # stealth-rendered site, but plain httpx, real postedOn/startDate, and no ToS
      # exposure — dropped stealth_html for this source entirely.
      # public_base_url is Workday's native candidate-facing host (a real HTML page), NOT
      # the CXS API host used by list_url — confirmed via curl that CXS returns raw JSON
      # when opened directly (a human clicking that link got a JSON dump instead of a job
      # posting); .../en-US/Careers_GM/ renders correctly and shows the right job.
      workday_native: true
      list_url: https://generalmotors.wd5.myworkdayjobs.com/wday/cxs/generalmotors/Careers_GM/jobs
      public_base_url: https://generalmotors.wd5.myworkdayjobs.com/en-US/Careers_GM/
  - key: ford
    company: Ford Motor Company
    adapter: oracle_hcm
    platform: oracle_hcm
    config:
      # careers.ford.com (Radancy/TalentBrew) is only the marketing job board; the real
      # backing system — discovered via a real apply.ford.com job link, same vanity-domain
      # pattern as DENSO — is Oracle HCM at efds.fa.em5.oraclecloud.com, site CX_1. Same
      # job count as the TalentBrew scrape (~824) but with real PostedDate, an official
      # REST API instead of HTML scraping, and no pagination-selector fragility.
      # detail_base_url is the REST API used internally for the description fetch — it
      # returns raw JSON, not something to hand a human. public_url_template builds the
      # *displayed* url instead, pointed at Oracle's own public candidate-experience page
      # (confirmed via curl: real rendered HTML with the correct job title, same {id}) —
      # not the same URL as careers.ford.com/Radancy, which needs an unrelated ID this API
      # doesn't expose, but a genuinely working first-party page for the same posting.
      paginate: true
      list_url: https://efds.fa.em5.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList.secondaryLocations&finder=findReqs;siteNumber=CX_1,facetsList=LOCATIONS,limit=200,offset=0
      items_path: items.0.requisitionList
      total_path: items.0.TotalJobsCount
      detail_base_url: https://efds.fa.em5.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitionDetails/
      # Ford's Oracle tenant splits a posting across three separate fields instead of
      # putting everything in ExternalDescriptionStr alone — confirmed directly against
      # the raw API: ExternalDescriptionStr was only the short intro (1.3KB), while
      # ExternalQualificationsStr (6.6KB) held the actual qualifications *and* each job's
      # visa-sponsorship statement, entirely missed until this was added.
      detail_description_path: [ExternalDescriptionStr, ExternalResponsibilitiesStr, ExternalQualificationsStr]
      public_url_template: https://efds.fa.em5.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1/job/{id}
      fields:
        id: Id
        title: Title
        url: Id
        location: PrimaryLocation
        country: PrimaryLocationCountry
        employment_type: WorkplaceType
        posted_at: PostedDate
  - key: stellantis
    company: Stellantis
    adapter: adp_recruiting
    platform: adp_recruiting
    config:
      # careers.stellantis.com (the Angular/Findly front end previously scraped via
      # stealth_html, only its first ~10-job page reachable) is just a skin over
      # Stellantis's real backing system: ADP Recruiting Management, at
      # myjobs.adp.com/stellantisexternalcx — a real job link
      # (careers.stellantis.com/job/23716470/... == myjobs.adp.com/stellantisexternalcx/
      # cx/job-details?reqId=5001216839806, confirmed same posting) exposes a public,
      # unauthenticated two-call API: /public/staffing/v1/career-site/{domain} returns a
      # myJobsToken, replayed as a myjobstoken header on
      # .../job-requisitions/apply-custom-filters, which returns every requisition
      # (full description, qualifications, and posting date included, no separate detail
      # fetch needed) with real $top/$skip pagination — no browser needed at all.
      career_site_domain: stellantisexternalcx
  - key: nissan
    company: Nissan
    adapter: workday
    platform: workday
    config:
      # public_base_url is Workday's native candidate-facing host, not the CXS API host
      # used by list_url — same fix/reasoning as GM's entry above.
      workday_native: true
      list_url: https://alliance.wd3.myworkdayjobs.com/wday/cxs/alliance/nissanjobs/jobs
      public_base_url: https://alliance.wd3.myworkdayjobs.com/en-US/nissanjobs/
      applied_facets:
        locationCountry: [bc33aa3152ec42d4995f4791a106ed09]
  - key: volkswagen
    company: Volkswagen Group of America
    adapter: successfactors_rmk
    platform: successfactors_rmk
    config:
      list_url: https://jobs.volkswagen-group.com/search/?locale=en_US&optionsFacetsDD_country=US
      card_selector: tr.data-row
      link_selector: a.jobTitle-link
      title_selector: a.jobTitle-link
      location_selector: td.colLocation span.jobLocation
      page_parameter: startrow
      page_size: 25
      description_selector: .jobdescription
      posted_at_selector: td.colDate span.jobDate
  - key: tesla
    company: Tesla
    adapter: unsupported
    platform: akamai_protected
    unsupported_reason: www.tesla.com/careers returns an Akamai "Access Denied" edge block on plain requests; no verified anonymous endpoint, and this project does not add anti-bot workarounds.
  - key: paccar
    company: PACCAR
    adapter: successfactors_rmk
    platform: successfactors_rmk
    config:
      list_url: https://jobs.paccar.com/search/?q=&locationsearch=&optionsFacetsDD_country=US
      card_selector: tr.data-row
      link_selector: a.jobTitle-link
      title_selector: a.jobTitle-link
      location_selector: td.colLocation span.jobLocation
      page_parameter: startrow
      page_size: 25
      description_selector: .jobdescription
      posted_at_selector: td.colDate span.jobDate
  - key: valeo
    company: Valeo
    adapter: workday
    platform: workday
    config:
      # public_base_url is Workday's native candidate-facing host, not the CXS API host
      # used by list_url — same fix/reasoning as GM's entry above.
      workday_native: true
      list_url: https://valeo.wd3.myworkdayjobs.com/wday/cxs/valeo/valeo_jobs/jobs
      public_base_url: https://valeo.wd3.myworkdayjobs.com/en-US/valeo_jobs/
  - key: denso
    company: DENSO
    adapter: oracle_hcm
    platform: oracle_hcm
    config:
      # json_api adapters fetch a single page; limit is set high enough to cover DENSO's
      # ~100 open reqs in one request (Oracle HCM's recruitingCEJobRequisitions has no
      # separate pagination support in this adapter).
      # public_url_template: same reasoning as Ford's entry — detail_base_url is the
      # internal REST API (raw JSON), public_url_template builds the displayed url from
      # Oracle's own candidate-experience page instead (confirmed via curl).
      list_url: https://hcwt.fa.us2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList.secondaryLocations,flexFieldsFacet.values&finder=findReqs;siteNumber=CX_1,facetsList=LOCATIONS%3BWORK_LOCATIONS%3BWORKPLACE_TYPES%3BTITLES%3BCATEGORIES%3BORGANIZATIONS%3BPOSTING_DATES%3BFLEX_FIELDS,limit=500,offset=0
      items_path: items.0.requisitionList
      detail_base_url: https://hcwt.fa.us2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitionDetails/
      # DENSO's tenant currently puts everything in ExternalDescriptionStr alone
      # (Responsibilities/Qualifications come back empty, confirmed directly against the
      # raw API) — listed as a 3-field concatenation anyway, same as Ford, since that's
      # safe either way and doesn't silently miss content if DENSO's data entry changes.
      detail_description_path: [ExternalDescriptionStr, ExternalResponsibilitiesStr, ExternalQualificationsStr]
      public_url_template: https://hcwt.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1/job/{id}
      fields:
        id: Id
        title: Title
        url: Id
        location: PrimaryLocation
        country: PrimaryLocationCountry
        employment_type: WorkplaceType
        posted_at: PostedDate
  - key: astemo
    company: Astemo
    adapter: stealth_html
    platform: html
    config:
      # Same Cloudflare Turnstile challenge and platform vendor as GM; fetched via the
      # stealth_html adapter. Global site — expect mostly non-US postings.
      list_url: https://www.careers.astemo.com/en/jobs/
      card_selector: .card-job
      link_selector: .card-title a
      title_selector: .card-title a
      location_selector: .job-meta__location
      page_number_parameter: page
      page_size: 20
      description_selector: article.cms-content
  - key: hri
    company: Honda Research Institute USA
    adapter: html_multi_index
    platform: html
    config:
      index_urls: [https://usa.honda-ri.com/associate-positions]
      card_selector: .b-job-item
      link_selector: a.b-button
      title_selector: .b-job-item__title h3
      location_selector: .b-job-item__location
      description_selector: .journal-content-article
  - key: tri
    company: Toyota Research Institute
    adapter: lever
    platform: lever
    config:
      list_url: https://api.lever.co/v0/postings/tri?mode=json
      listing_description_path: description
      fields:
        id: id
        title: text
        url: hostedUrl
        location: categories.location
        department: categories.department
        employment_type: categories.commitment
        posted_at: createdAt
  - key: mbrdna
    company: Mercedes-Benz Research & Development North America
    adapter: lever
    platform: lever
    config:
      list_url: https://api.lever.co/v0/postings/MBRDNA?mode=json
      listing_description_path: description
      fields:
        id: id
        title: text
        url: hostedUrl
        location: categories.location
        department: categories.department
        employment_type: categories.commitment
        posted_at: createdAt
  - key: woven
    company: Woven by Toyota
    adapter: lever
    platform: lever
    config:
      # woven.toyota/en/careers/ is a Next.js front end (custom UI over a public API, no
      # bot protection); its detail-page URL embeds a UUID job ID that exactly matches
      # Lever's own posting ID for the same job (confirmed: a real "Apply" link for
      # woven.toyota/en/careers/detail/9da63697-.../ resolved to
      # jobs.lever.co/woven-by-toyota/9da63697-.../apply) — the real backend is a public,
      # unauthenticated Lever tenant, same platform/shape as TRI/MBRDNA. ~143 postings,
      # mostly Tokyo/Japan with a smaller US contingent (Ann Arbor MI, Palo Alto CA).
      list_url: https://api.lever.co/v0/postings/woven-by-toyota?mode=json
      listing_description_path: description
      fields:
        id: id
        title: text
        url: hostedUrl
        location: categories.location
        department: categories.department
        employment_type: categories.commitment
        posted_at: createdAt
  - key: hma
    company: Hyundai Motor America
    adapter: successfactors_rmk
    platform: successfactors_rmk
    config:
      list_url: https://careers-americas.hyundai.com/hma/search/?optionsFacetsDD_country=US
      card_selector: tr.data-row
      link_selector: a.jobTitle-link
      title_selector: a.jobTitle-link
      location_selector: td.colLocation span.jobLocation
      page_parameter: startrow
      page_size: 25
      description_selector: .jobdescription
      posted_at_selector: td.colDate span.jobDate
  - key: apple
    company: Apple
    adapter: apple
    platform: apple
    config:
      # jobs.apple.com's React Router SPA server-renders every page (search results and
      # job detail alike) with a full JSON snapshot embedded as
      # `window.__staticRouterHydrationData = JSON.parse("...")` — a plain GET already
      # returns exact posting dates and full descriptions, no browser needed. Dropped
      # stealth_html entirely once this was found by inspecting the plain HTML directly.
      list_url: https://jobs.apple.com/en-us/search?location=united-states-USA
      page_size: 20
  - key: google
    company: Google
    adapter: stealth_html
    platform: html
    config:
      # Not bot-blocked; rendering is required because content only exists after this
      # "boq-hiring" frontend's JS runs. Its client-side router emits job hrefs relative
      # to a shorter base path than the page's own URL, hence detail_base_url. CSS classes
      # here are Closure-compiler hashes (e.g. QJPWVe, lLd3Je) — expect these to be more
      # fragile across a Google redesign than other sources' hand-authored class names.
      list_url: https://www.google.com/about/careers/applications/jobs/results
      detail_base_url: https://www.google.com/about/careers/applications/
      card_selector: li.lLd3Je
      link_selector: a[aria-label^="Learn more about"]
      title_selector: h3.QJPWVe
      location_selector: span.r0wTof
      next_selector: a[aria-label="Go to next page"]
      description_selector: .DkhPwc
  - key: waymo
    company: Waymo
    adapter: html_paginated
    platform: html
    config:
      list_url: https://careers.withwaymo.com/jobs/search
      card_selector: div.job-search-results-card
      link_selector: .card-title a
      title_selector: .card-title a
      location_selector: .job-component-location
      description_selector: .job-description
  - key: hatci
    company: Hyundai America Technical Center, Inc.
    adapter: successfactors_rmk
    platform: successfactors_rmk
    config:
      list_url: https://careers-americas.hyundai.com/hatci/search/
      card_selector: tr.data-row
      link_selector: a.jobTitle-link
      title_selector: a.jobTitle-link
      location_selector: td.colLocation span.jobLocation
      page_parameter: startrow
      page_size: 25
      description_selector: .jobdescription
      posted_at_selector: td.colDate span.jobDate
  - key: caterpillar
    company: Caterpillar
    adapter: workday
    platform: workday
    config:
      # careers.caterpillar.com is a marketing job board; a real apply link off a sample
      # posting (Staffed Technologies Validation Engineer, R0000389840) revealed the
      # actual candidate-facing system is Workday, at cat.wd5.myworkdayjobs.com — a fully
      # public, unauthenticated CXS API (~982 jobs, no bot protection). Same shape and
      # same fix as GM/Toyota/Valeo's entries: public_base_url is Workday's native
      # candidate-facing host, not the CXS API host used by list_url (confirmed via curl
      # that opening the CXS API url directly returns raw JSON, not a browsable page).
      # startDate matched the sample job's relative "Posted 8 Days Ago" text exactly
      # (2026-08-27, 8 days before the 2026-09-04 check) — a stable, absolute date field.
      workday_native: true
      list_url: https://cat.wd5.myworkdayjobs.com/wday/cxs/cat/CaterpillarCareers/jobs
      public_base_url: https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/
  - key: nvidia
    company: NVIDIA
    adapter: workday
    platform: workday
    config:
      # Sample job (Senior Systems Software Engineer - Autonomous Vehicles, JR2015666) was
      # given directly as a nvidia.wd5.myworkdayjobs.com link — same public, unauthenticated
      # Workday CXS API shape as GM/Toyota/Valeo/Caterpillar. startDate (2026-08-29) matched
      # the listing's relative "Posted 6 Days Ago" exactly against a 2026-09-04 check.
      # KNOWN COVERAGE GAP: this tenant's search API hard-caps results at 2000 — confirmed by
      # querying offset=2000, which silently wraps back to the first job instead of erroring
      # or returning empty, while the listing's own facet counts (jobFamilyGroup) sum to
      # ~2,697 real open jobs. The generic workday_native loop already stops correctly at
      # offset==total (captured as 2000 from page one), so it never actually hits the wrap
      # bug, but roughly 700 of NVIDIA's real postings (~26%) are structurally unreachable
      # through this API — not a bug in this adapter, a real limit of NVIDIA's Workday
      # instance. The listing appears sorted newest-first (spot-checked across offsets 100
      # to 1990: ages increase monotonically), so the missing tail is likely the oldest
      # postings — partially, not fully, mitigated by the pipeline's own recency cutoff.
      # KNOWN RATE-LIMIT ISSUE (worse than GM/Caterpillar's, see docs/SPEC.md §5.7): a first
      # `job-hunter search --companies nvidia` run reproducibly hit 429 on the detail fetch,
      # even *without* --refresh-details. Confirmed live: 1,206 of the 2,000 listed jobs fall
      # inside the default 30-day recency window and each still needs a detail fetch, which
      # is enough concurrent load (max_concurrent_details: 8) to trip this tenant's throttle
      # on every attempt tried. Not fixed here — would need a collector.py change (lower
      # concurrency, or make _detail_for resilient to one failure) outside this source's
      # onboarding scope. Expect to retry a first full ingest of this source.
      workday_native: true
      list_url: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
      public_base_url: https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite/
  - key: deere
    company: Deere & Company
    adapter: eightfold
    platform: eightfold
    config:
      # careers.deere.com's listing page (/careers?query=...) renders zero job data
      # server-side — pure JS shell. The real backend, found by rendering it once with
      # Playwright and reading its actual XHR calls (not guessed — an initial guess at
      # /api/apply/v2/jobs, a path seen on other Eightfold-powered sites, returned a
      # same-shaped 403 "Not authorized for PCSX"), is Eightfold's public "pcsx" API:
      # /api/pcsx/search (list) and /api/pcsx/position_details (detail), both plain
      # httpx, no cookies/session/auth needed. location=united states +
      # filter_include_remote=1 (server-side, same params the user's own sample URLs
      # used) cuts the catalog from 226 (global) to 99 (US); no `query` keyword is
      # passed, so this fetches Deere's full US catalog, not just "autonomous" postings
      # — keyword scoping is this project's job, never the adapter's (see CLAUDE.md).
      # postedTs (epoch seconds, listing-level) matched the sample job's detail-page
      # JSON-LD `datePosted` exactly (2026-08-07T16:43:48) — a stable, correct field;
      # a separate `creationTs` field also exists but is ~11 days earlier and NOT the
      # same value — confirmed not to use it. Default sort is `distance`, not date
      # (non-monotonic across a page), so no early-pagination-stop is attempted.
      list_url: https://careers.deere.com/api/pcsx/search
      detail_url: https://careers.deere.com/api/pcsx/position_details
      public_base_url: https://careers.deere.com
      params:
        domain: johndeere.com
        location: united states
        filter_include_remote: 1
        filter_include_relocation: 0
      detail_params:
        domain: johndeere.com
        hl: en
  - key: anthropic
    company: Anthropic
    adapter: greenhouse
    platform: greenhouse
    config:
      # anthropic.com/careers/jobs links directly to job-boards.greenhouse.io/anthropic/
      # jobs/<id> (confirmed via a real job link) — Greenhouse's public Job Board API
      # mirrors that board exactly, zero-auth, at boards-api.greenhouse.io. `?content=true`
      # inlines every job's full description in the one list response (592 jobs, single
      # request) so no per-job detail fetch is ever needed. `absolute_url` is the same
      # real candidate-facing page a human lands on, used directly as `url` — no
      # public_url_template needed. Note (adapters/greenhouse.py): the `content` field is
      # HTML-entity-double-encoded by Greenhouse itself, unescaped there once, centrally,
      # for every Greenhouse company, not per-company config.
      list_url: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs?content=true
      items_path: jobs
      listing_description_path: content
      fields:
        id: id
        title: title
        url: absolute_url
        location: location.name
        department: departments.0.name
        posted_at: first_published
  - key: openai
    company: OpenAI
    adapter: ashby
    platform: ashby
    config:
      # openai.com/careers/search is Cloudflare-challenge-protected on plain requests
      # (cf-mitigated: challenge) — but the real backing system is Ashby, reachable
      # directly and unprotected at jobs.ashbyhq.com/openai (confirmed 200, a real board —
      # not the "Page not found" an invalid Ashby org slug returns, which is exactly what
      # a first guess at jobs.ashbyhq.com/anthropic turned out to be: Anthropic is not on
      # Ashby at all, it's Greenhouse, see the anthropic entry above). Ashby's own
      # documented public posting API (api.ashbyhq.com/posting-api/job-board/<org>)
      # mirrors the board exactly: zero-auth, the full board (779 jobs) in one request,
      # each with full descriptionHtml inline (no per-job detail fetch needed) and clean
      # (non-double-encoded) text throughout. jobUrl is the same real candidate-facing
      # page a human lands on. address.postalAddress gives clean structured
      # country/state/city for the high-confidence branch of evaluate_location, better
      # than most adapters here get; workplaceType ("Hybrid"/"Remote"/"OnSite") maps
      # straight onto work_arrangement via json_api.py's generic opt-in field.
      list_url: https://api.ashbyhq.com/posting-api/job-board/openai
      items_path: jobs
      listing_description_path: descriptionHtml
      fields:
        id: id
        title: title
        url: jobUrl
        location: location
        department: department
        employment_type: employmentType
        posted_at: publishedAt
        work_arrangement: workplaceType
        country: address.postalAddress.addressCountry
        state: address.postalAddress.addressRegion
        city: address.postalAddress.addressLocality
  - key: perplexity
    company: Perplexity
    adapter: ashby
    platform: ashby
    config:
      # Same shape as the openai entry above: jobs.ashbyhq.com/perplexity is a real,
      # unauthenticated Ashby board (confirmed 200 with real postings, 112 jobs) and its
      # public posting API mirrors it exactly — full descriptionHtml inline, no per-job
      # detail fetch, structured address.postalAddress for evaluate_location, and
      # workplaceType mapped onto work_arrangement.
      list_url: https://api.ashbyhq.com/posting-api/job-board/perplexity
      items_path: jobs
      listing_description_path: descriptionHtml
      fields:
        id: id
        title: title
        url: jobUrl
        location: location
        department: department
        employment_type: employmentType
        posted_at: publishedAt
        work_arrangement: workplaceType
        country: address.postalAddress.addressCountry
        state: address.postalAddress.addressRegion
        city: address.postalAddress.addressLocality
  - key: cariad
    company: CARIAD (Volkswagen)
    adapter: successfactors_rmk
    platform: successfactors_rmk
    config:
      # CARIAD is a business unit inside the same jobs.volkswagen-group.com
      # SuccessFactors RMK instance as the volkswagen entry above, not a separate site.
      # Its own landing page (jobs.volkswagen-group.com/cariad) suggested scoping via
      # its brand-prefixed listing path (/cariad/search/) the way other legal entities
      # in this instance do (e.g. /VWFS/, /Porsche_Holding_Portugal/) — confirmed *not*
      # to work: /cariad/search/ ignores both optionsFacetsDD_country and startrow via
      # plain httpx, always returning the same fixed ~10-12 row default regardless of
      # query params (verified: identical result sets across startrow=0/25/50/75, and
      # a country=DE facet returning the same rows as no facet at all). The top-level
      # /search/ endpoint's own q= keyword param, by contrast, genuinely scopes results
      # to CARIAD (confirmed: every result becomes a /cariad/job/... link) — but *only*
      # when used alone; combining q= with optionsFacetsDD_country in the same request
      # silently drops the q filter and falls back to unfiltered results (confirmed
      # live, same platform quirk independent of the /cariad/search/ one above). So this
      # entry deliberately omits any country facet and relies on job-hunter's own
      # evaluate_location to do U.S. filtering after the fact, exactly as it already
