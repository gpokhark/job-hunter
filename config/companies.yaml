    platform: csod
    config:
      # hella.csod.com's visible careersite (ux/ats/careersite/3/home) is an Angular
      # shell with no job data in its own plain HTML — but every page load embeds a
      # short-lived anonymous JWT (csod.context.token, sub: -102, a guest user) scoped
      # by its own rurls claim to a fixed API allowlist. Found by rendering the listing
      # page once with Playwright and reading its own XHR calls: that token is replayed
      # as a Bearer header on POST https://uk.api.csod.com/rec-job-search/external/jobs
      # — confirmed genuinely public/anonymous by re-minting the token from a second,
      # independent plain httpx GET (no browser, no cookies) and replaying it with the
