    # (linking to Facebook's own scraping-permission policy) — a real, citable ToS-style
    # restriction, not a generic "hard to scrape" judgment call, and qualitatively different from
    # every other source in this project's history. The site runs on Meta's internal
    # Comet/Relay platform (a `datr` anti-abuse cookie, CSP scoped to facebook.com/fbcdn.net); its
    # job search (/jobsearch/) only renders via a live client-side Relay GraphQL query
    # (doc_id/queryID-keyed, e.g. CandidatePortalJobDetailsViewQuery) — a per-job detail page does
    # embed a server-rendered Relay preloader JSON blob with the full posting (no browser needed
    # for that one page), but scraping it at the scale needed (hundreds of pages per run, via
    # jobsearch/sitemap.xml's job-ID list, itself carrying no real per-job date) is exactly the
    # automated collection the robots.txt notice addresses, and depends on the same internal,
    # auth-adjacent GraphQL/Relay contract this project declines to reverse-engineer or replay.
    # stealth_html isn't the right tool either — the blocker isn't incidental JS rendering of
    # otherwise-public content, it's an explicit request not to automate collection at all.
    unsupported_reason: metacareers.com's robots.txt explicitly prohibits automated data collection without Facebook's express written permission; job search only renders via an internal Relay/GraphQL contract with no verified plain anonymous listing endpoint, and this project does not defeat an explicitly disclosed anti-automation policy.
  - key: zf
    company: ZF Friedrichshafen AG
    adapter: zf
    platform: successfactors_rmk
    config:
      # The given listing URL (career5.successfactors.eu/careers?company=zffriedric,
      # SAP's newer Career Site Builder product) turned out to be a dead end: plain
      # httpx returns 200 but it's an internal "verp-client" widget shell whose own JS
      # references a loginFlowRequired redirect — no hydration blob, no JSON-LD, and no
      # trace of the sample job (76246/"VAVE Engineer") anywhere in it. Following the
      # sample job's real host instead (jobs.zf.com) found ZF's actual, live,
      # candidate-facing site: the classic server-rendered SuccessFactors RMK
      # ("Job2Web") search table — the same platform/template as PACCAR/Volkswagen/
      # Valeo's existing successfactors_rmk config (tr.data-row / a.jobTitle-link /
      # td.colLocation span.jobLocation, startrow pagination, 25/page) — confirmed via
      # plain curl, no cookies, no session. 166 US jobs (optionsFacetsDD_country=US),
      # 808 total globally; the given sample job (VAVE Engineer, El Marques, MX,
      # requisition path .../El-Marques-VAVE-Engineer-Quer-76246/1413552133/) confirmed
      # present verbatim via a direct keyword search (?q=VAVE) on this same endpoint.
      # Note the "76246" in both the given sample URL and every other job's URL slug is
      # a postal/zip code, not the requisition ID — the real native ID is the trailing
      # numeric segment (1413552133); no id_attribute is configured here (same as the
      # existing PACCAR/Volkswagen entries), so job_id falls back to a deterministic
      # title+location+url hash like theirs already do.
      # The detail page's description sits in its own dedicated `.jobdescription` span
      # (verified identical to PACCAR/Volkswagen's already-working description_selector)
      # despite ZF's detail page otherwise using the *other* RMK template (BMW's
      # .joblayouttoken/.rtltextaligneligible value-class reuse) — see adapters/zf.py
      # for why that still needed one small bespoke piece (posted_at only, not
      # description): ZF reports datePosted as schema.org microdata
      # (<meta itemprop="datePosted" content="...">) in Java Date.toString() format,
      # not the <script type="application/ld+json"> block html_paginated's built-in
      # fallback looks for, and the listing table itself has no date column at all.
      # CAVEAT: re-sampled ~25 US postings' datePosted values and found them clustered
      # within roughly the last month regardless of how old the underlying requisition
      # looks (one very low-numbered, presumably long-open req id showed the same
      # recent date as brand-new ones) — this looks like SuccessFactors RMK's known
      # periodic "republish" refresh rather than a true original posting date. Still
      # directionally useful (stable across repeat fetches, not a per-request "now"),
      # but not trusted for early-pagination-stop — the listing is also confirmed NOT
      # reliably sorted newest-first (an old-looking req id turned up on page 6 sorted
      # among much newer-looking ids) — so, like Ford/DENSO's Oracle HCM listing, this
      # always fetches its full catalog.
      list_url: https://jobs.zf.com/search/?optionsFacetsDD_country=US
      card_selector: tr.data-row
      link_selector: a.jobTitle-link
      title_selector: a.jobTitle-link
      location_selector: td.colLocation span.jobLocation
      page_parameter: startrow
      page_size: 25
      description_selector: .jobdescription
  - key: hella
