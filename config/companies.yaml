  - key: molex
    company: Molex
    adapter: html_paginated
    platform: avature
    config:
      # koch.avature.net is a single shared career portal for every Koch Industries
      # subsidiary (Molex, Georgia-Pacific, INVISTA, Guardian Glass, ...), not a
      # Molex-only site. The default SearchJobs landing page renders a fixed
      # "recommended jobs" widget over plain httpx regardless of any query string
      # (confirmed: identical results for no query, ?query=Molex, ?keyword=Molex, etc.)
      # — Avature's real search only executes through its client-side wizard, found by
      # driving it once with Playwright (selecting the "Company" facet field, id 732,
      # value 6322=Molex, then submitting) and reading the resulting redirect URL:
      # ?732=6322&732_format=1077&listFilterMode=1&jobRecordsPerPage=6 — confirmed this
      # exact query string also works over plain httpx afterward, no browser needed at
      # request time. Real, working pagination via jobOffset (confirmed: a different
      # company id, e.g. Georgia-Pacific's 6299, returns a completely different result
      # set, proving the facet filter itself is genuine, not coincidental). Server
      # hard-caps at 6 results/page regardless of jobRecordsPerPage's requested value
      # (confirmed: =100 and =1000 both still return 6) — Molex's own global catalog is
      # large (confirmed real, distinct postings still appearing past jobOffset=1100,
      # unlike the default landing page's fixed 6), so max_pages is set well above the
      # html_paginated default; a full crawl issues on the order of 150-200 sequential
      # requests to this one host — a real, disclosed slowness tradeoff, not a bug.
      # Two disjoint article blocks share the same field-value CSS class: the plain
      # `article.article--result` card (search results) holds Location/Job Number as
      # `.article__content__field__value` (location_selector uses css_first, so it
      # reliably grabs Location, the first one in DOM order); the detail page's
      # `article.article--details` for the actual free-text body is distinguished from
      # its sibling metadata block by an additional `js_collapsible` class, not present
      # on the metadata block — description_selector is scoped to it for exactly that
      # reason (an unscoped `.article__content__view__field__value` would concatenate
      # Location/Job Number junk into the description otherwise). No listing- or
      # detail-page date field exists anywhere (checked both; no JSON-LD either), so no
      # posted_at_selector is set — passes_recency keeps undated jobs by design.
      # Verified live end-to-end against a real job pulled from this same
      # Molex-filtered feed (193448, "Representative, Customer Service") with matching
      # title/location/description; the original sample job (185073, "Principal Product
      # Design Engineer") independently confirmed reachable and correctly parsed via its
      # own JobDetail page in Phase 1, though its exact position within ~1200 global
      # postings' pagination wasn't exhaustively located.
      list_url: https://koch.avature.net/en_US/careers/SearchJobs/?732=6322&732_format=1077&listFilterMode=1&jobRecordsPerPage=6
      card_selector: article.article--result
      link_selector: .article__header__text__title a
      title_selector: .article__header__text__title a
      location_selector: .article__content__field__value
      description_selector: .js_collapsible .article__content__view__field__value
      page_parameter: jobOffset
      page_size: 6
      max_pages: 220
