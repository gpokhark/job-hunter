      list_api_url: https://uk.api.csod.com/rec-job-search/external/jobs
      career_site_id: 3
      detail_url_template: "https://hella.csod.com/ux/ats/careersite/3/home/requisition/{id}?c=hella&lang=en-US"
      page_size: 250
