version: 1
database_path: data/jobs.sqlite3
collection:
  max_concurrent_sources: 3
  max_concurrent_details: 8
  max_connections: 24
  max_keepalive_connections: 12
  timeout_seconds: 30
  max_retries: 3
search:
  country: US
  include_work_arrangements: [onsite, hybrid, remote, unknown]
  max_posting_age_days: 45
  # Display-only, for jobs with no discoverable posted_at (see config.py's SearchConfig) —
  # never a filter. first_seen_at within undated_new_days -> tagged [New]; past
  # undated_stale_days -> tagged "Long-standing".
  undated_new_days: 15
  undated_stale_days: 45
recommendation:
  minimum_score: 75
logging:
  level: INFO
# job-hunter cleanup's tunable knobs (docs/retention-cleanup-plan.md). Dry-run by default;
# nothing here deletes anything on its own.
retention:
  closed_job_after_days: 10
  report_after_days: 15
  keep_latest_reports_per_slug: 2
# job-hunter pipeline's child-process supervision (docs/agent-runtime-audit.md). Shipped as a
# safe default for a fresh clone -- a stuck search/review/refilter/radar subprocess would
# otherwise hang the pipeline indefinitely (PipelineConfig.stage_timeout_seconds itself still
# defaults to None/no-timeout at the Python level, so an existing installation that already has
# this commented out, or removed, is unaffected unless it re-copies this file). 8 hours is sized
# to comfortably exceed a large sequential local-model review (one job at a time against LM
# Studio) -- raise it further, or comment it back out, if your own review runs legitimately take
# longer than that.
pipeline:
  stage_timeout_seconds: 28800  # 8 hours

