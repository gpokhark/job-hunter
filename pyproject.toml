[project]
name = "job-hunter"
version = "0.1.0"
description = "Browser-free, agent-friendly employer career-site collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "selectolax>=0.3.21,<1",
]

[project.optional-dependencies]
# Only needed for the "stealth_html" adapter, used against sites behind a
# Cloudflare/Akamai-style bot-management challenge. Not installed by default —
# pulls in a real headless browser. Install with `uv sync --extra stealth`,
# then run `uv run scrapling install` once to fetch the browser binary.
stealth = ["scrapling[fetchers]>=0.4,<1"]

[project.scripts]
job-hunter = "job_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: makes requests to live career sites"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
